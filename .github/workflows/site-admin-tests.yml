name: Site admin offline checks

on:
  pull_request:
    paths:
      - 'projects/site-admin/**'
      - '.github/workflows/site-admin-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        working-directory: projects/site-admin
        run: |
          python -m unittest discover -s tests -v
          python manager.py sites
