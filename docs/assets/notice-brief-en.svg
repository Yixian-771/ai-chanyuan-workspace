<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1450" viewBox="0 0 800 1450" role="img" aria-labelledby="title desc">
<title id="title">China Owes a Debt: four questions and a claimed sum</title><desc id="desc">English graphic summarizing questions and figures in Xuefeng's notice. Claims are not independently verified.</desc>
<rect width="800" height="1450" fill="#f7f3e9"/><rect width="800" height="13" fill="#7d211f"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="48" y="92" font-size="47" font-weight="700" fill="#7d211f">CHINA OWES A DEBT</text>
<text x="48" y="142" font-size="32" font-weight="700" fill="#7d211f">A NOTICE TO THE WORLD</text>
<text x="48" y="184" font-size="22" fill="#675e54">Xuefeng's notice, dated 3 November 2026</text>
<rect x="48" y="220" width="244" height="42" rx="21" fill="#7d211f"/><text x="67" y="249" font-size="22" font-weight="700" fill="#ffffff">FOUR QUESTIONS</text>
<g fill="#2f3431" font-size="24">
<circle cx="67" cy="302" r="17" fill="#d9b56c"/><text x="60" y="310" font-size="21" font-weight="700" fill="#392b23">1</text><text x="101" y="310">Which law does the notice say was broken?</text>
<circle cx="67" cy="365" r="17" fill="#d9b56c"/><text x="60" y="373" font-size="21" font-weight="700" fill="#392b23">2</text><text x="101" y="359">If these were illicit proceeds, why not return</text><text x="101" y="391">them to alleged victims instead of the treasury?</text>
<circle cx="67" cy="450" r="17" fill="#d9b56c"/><text x="60" y="458" font-size="21" font-weight="700" fill="#392b23">3</text><text x="101" y="458">Which beliefs were labelled “superstition”?</text>
<circle cx="67" cy="515" r="17" fill="#d9b56c"/><text x="60" y="523" font-size="21" font-weight="700" fill="#392b23">4</text><text x="101" y="523">Which law's implementation was allegedly undermined?</text>
</g>
<rect x="48" y="565" width="704" height="385" rx="22" fill="#fffdf8" stroke="#e1d8c9" stroke-width="2"/>
<rect x="48" y="565" width="704" height="74" rx="22" fill="#c28b13"/><rect x="48" y="610" width="704" height="29" fill="#c28b13"/>
<text x="72" y="614" font-size="29" font-weight="700" fill="#ffffff">CLAIMED TOTAL  ·  RMB 67,177,185</text>
<g fill="#414039" font-size="23">
<text x="73" y="682">Compensation sought for 17 homes</text><text x="715" y="682" text-anchor="end">30,000,000</text>
<text x="73" y="731">Return of confiscated funds</text><text x="715" y="731" text-anchor="end">1,107,185</text>
<text x="73" y="780">Claimed losses for about 80 members</text><text x="715" y="780" text-anchor="end">8,000,000</text>
<text x="73" y="829">Detention claim: 2,908 days × 10,000</text><text x="715" y="829" text-anchor="end">29,080,000</text>
<text x="73" y="878">Less amount reported as already paid</text><text x="715" y="878" text-anchor="end">−1,010,000</text>
</g>
<line x1="72" y1="704" x2="726" y2="704" stroke="#e2ded4"/><line x1="72" y1="753" x2="726" y2="753" stroke="#e2ded4"/><line x1="72" y1="802" x2="726" y2="802" stroke="#e2ded4"/><line x1="72" y1="851" x2="726" y2="851" stroke="#e2ded4"/>
<text x="73" y="925" font-size="18" fill="#6b665d">The notice separately mentions THB 580.</text>
<rect x="48" y="987" width="704" height="151" rx="20" fill="#e4eee2"/><text x="72" y="1034" font-size="25" font-weight="700" fill="#305939">BEYOND THE LEGAL ACCOUNT</text><text x="72" y="1077" font-size="23" fill="#303a33">The author also frames this as a moral debt,</text><text x="72" y="1110" font-size="23" fill="#303a33">not only a dispute over money and law.</text>
<rect x="48" y="1173" width="704" height="138" rx="20" fill="#e8eef2"/><text x="72" y="1219" font-size="25" font-weight="700" fill="#264d68">THE REQUEST</text><text x="72" y="1261" font-size="22" fill="#303a43">The notice asks for payment within three months</text><text x="72" y="1293" font-size="22" fill="#303a43">and proposes 8% annual interest after the deadline.</text>
<text x="48" y="1361" font-size="19" fill="#625c55">Graphic based on Xuefeng's notice. This is an attributed summary,</text><text x="48" y="1389" font-size="19" fill="#625c55">not an independent finding or a full translation of the notice.</text>
</g><rect x="0" y="1420" width="800" height="30" fill="#7d211f"/></svg>