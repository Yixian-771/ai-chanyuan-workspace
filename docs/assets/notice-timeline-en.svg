<title id="title">China Owes a Debt: Lifechanyuan's account in a timeline</title><desc id="desc">An English timeline adapted from the supplied Chinese graphic and Xuefeng's notice, which invites independent verification.</desc>
<rect width="1600" height="1170" fill="#f7f3e9"/><rect width="1600" height="14" fill="#7d211f"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="64" y="93" font-size="54" font-weight="700" fill="#7d211f">CHINA OWES A DEBT</text>
<text x="64" y="151" font-size="37" font-weight="700" fill="#7d211f">Lifechanyuan's account · a timeline</text>
<text x="64" y="196" font-size="25" fill="#71695e">Selected points from the supplied Chinese timeline · 3 November 2026 notice</text>
<rect x="64" y="231" width="1472" height="70" rx="12" fill="#3a5d3d"/>
<text x="91" y="277" font-size="28" font-weight="700" fill="white">WHEN</text><text x="339" y="277" font-size="28" font-weight="700" fill="white">WHAT XUEFENG RECOUNTS</text><text x="1154" y="277" font-size="28" font-weight="700" fill="white">OUR READING</text>
<g font-size="25" fill="#363a35">
<rect x="64" y="312" width="1472" height="125" rx="12" fill="#ffffff"/>
<text x="91" y="365" font-size="28" font-weight="700" fill="#315474">18 Apr 2009</text><text x="339" y="355">The first communal home began</text><text x="339" y="390">in Taiyuan, Shanxi.</text><text x="1154" y="365" fill="#3f6546">The first home takes root.</text>
<rect x="64" y="449" width="1472" height="140" rx="12" fill="#efe8de"/>
<text x="91" y="506" font-size="28" font-weight="700" fill="#315474">From 2013</text><text x="339" y="495">Xuefeng writes that 17 homes were destroyed;</text><text x="339" y="530">this passage names 16 in China.</text><text x="1154" y="495" fill="#3f6546">We question</text><text x="1154" y="530" fill="#3f6546">the legal basis.</text>
<rect x="64" y="601" width="1472" height="140" rx="12" fill="#ffffff"/>
<text x="91" y="658" font-size="28" font-weight="700" fill="#315474">Thailand</text><text x="339" y="647">A separate account describes</text><text x="339" y="682">residents leaving a home in Thailand.</text><text x="1154" y="647" fill="#3f6546">A separate Thailand account,</text><text x="1154" y="682" fill="#3f6546">different from the China list.</text>
<rect x="64" y="753" width="1472" height="140" rx="12" fill="#efe8de"/>
<text x="91" y="809" font-size="28" font-weight="700" fill="#315474">From Jul 2025</text><text x="339" y="799">Xuefeng recounts the apprehension</text><text x="339" y="834">of approximately 80 members.</text><text x="1154" y="799" fill="#3f6546">We invite independent</text><text x="1154" y="834" fill="#3f6546">examination.</text>
<rect x="64" y="905" width="1472" height="140" rx="12" fill="#ffffff"/>
<text x="91" y="961" font-size="28" font-weight="700" fill="#315474">23 Oct 2026</text><text x="339" y="950">A Linzhou court judgment involving</text><text x="339" y="985">six members and related property orders.</text><text x="1154" y="950" fill="#3f6546">We seek review of</text><text x="1154" y="985" fill="#3f6546">the decision.</text>
</g>
<text x="64" y="1093" font-size="21" fill="#605b54">Adapted from the supplied timeline credited to Zhongzhoucao; based on Xuefeng's notice.</text>
<text x="64" y="1122" font-size="21" fill="#605b54">Original: lifecosmos.org · thread 39366. Independent review is welcome.</text>
